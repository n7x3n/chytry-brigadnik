<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chytrý Brigádník</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <button id="settings-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-settings-icon lucide-settings">
                <path
                    d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                <circle cx="12" cy="12" r="3" />
            </svg>
        </button>
        <h1 class="header-text">Chytrý Brigádník</h1>
        <button id="add-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </header>
    <dialog id="job-modal">
        <form id="job-form">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Nová práce / brigáda</h3>
                <button type="button" id="cancel-btn" class="close-red-btn">✕</button>
            </div>
            <input type="text" id="job-name" placeholder="Název (např. Kavárna)" required>
            <input type="number" id="job-rate" placeholder="Hodinová mzda (Kč)" required>
            <label class="checkbox-row" for="tax-payer">
                <span>Daňový poplatník</span>
                <input type="checkbox" id="tax-payer">
            </label>
            <label class="checkbox-row" for="inv-1-2">
                <span>Invalidita 1. a 2. stupně</span>
                <input type="checkbox" id="inv-1-2">
            </label>
            <label class="checkbox-row" for="inv-3">
                <span>Invalidita 3. stupně</span>
                <input type="checkbox" id="inv-3">
            </label>
            <label class="checkbox-row" for="ztp">
                <span>ZTP/P</span>
                <input type="checkbox" id="ztp">
            </label>
            <input type="number" id="kids-count" placeholder="Počet dětí">
            <hr>
            <button type="submit" class="reg-button">Uložit</button>
        </form>
    </dialog>
    <dialog id="settings-modal">
        <div id="settings-main-view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2>Nastavení</h2>
                <button type="button" id="close-settings-btn" class="close-red-btn">✕</button>
            </div>
            <div class="settings-list">
                <div class="settings-item" id="open-data-settings-btn">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span class="settings-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-package-icon lucide-package">
                                <path
                                    d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
                                <path d="M12 22V12" />
                                <polyline points="3.29 7 12 12 20.71 7" />
                                <path d="m7.5 4.27 9 5.15" />
                            </svg>
                        </span>
                        <span style="font-weight: 500; font-size: 1rem;">Import / Export dat</span>
                    </div>
                    <span style="color: #71717a; font-size: 1.2rem;">&rsaquo;</span>
                </div>
            </div>
        </div>
        <div id="settings-data-view" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <button type="button" id="back-to-settings-btn"
                    style="background: #27272a; border: 1px solid #3f3f46; border-radius: 8px; width: 40px; height: 40px; color: #f4f4f5; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                </button>
                <h2>Správa dat</h2>
                <div style="width: 40px;"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px; max-width: 500px; margin: 30px auto 0 auto;">
                <button type="button" id="export-json-btn" class="reg-button" style="height: 60px; font-size: 1.05rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-down-to-line-icon lucide-arrow-down-to-line">
                        <path d="M12 17V3" />
                        <path d="m6 11 6 6 6-6" />
                        <path d="M19 21H5" />
                    </svg> Exportovat data (JSON)
                </button>
                <button type="button" id="import-json-btn" class="reg-button" style="height: 60px; font-size: 1.05rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-up-from-line-icon lucide-arrow-up-from-line">
                        <path d="m18 9-6-6-6 6" />
                        <path d="M12 3v14" />
                        <path d="M5 21h14" />
                    </svg>Importovat data (JSON)
                </button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
            </div>
        </div>
    </dialog>
    <dialog id="detail-modal">
        <div class="sheet-handle" id="sheet-handle"></div>
        <div id="detail-overview">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="detail-title">Název práce</h2>
                <button type="button" id="close-detail-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-x-icon lucide-x">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
            <hr>
            <div id="detail-content">
                <p id="detail-rate" style="color: #22c55e; font-size: 1.2rem; font-weight: bold;"></p>
            </div>
            <div id="month-selector"
                style="display: flex; justify-content: space-between; align-items:center; margin: 10px 0;">
                <button type="button" id="prev-month-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-left-icon lucide-arrow-left">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                </button>
                <h3 id="current-month-display"></h3>
                <button type="button" id="next-month-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-right-icon lucide-arrow-right">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </button>
            </div>
            <div id="calendar-grid"></div>
            <hr>
            <div style="margin-top: 10px; margin-bottom: 10px;">
                <button type="button" id="add-shift-btn" class="reg-button">+ Přidat
                    směnu</button>
                <button type="button" id="show-shift-list" class="reg-button" style="margin-top: 10px;">Zobrazit seznam
                    směn</button>
            </div>
            <hr style="margin-bottom: 10px;">
            <div id="detail-summary-table">
            </div>
            <hr>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="button" id="delete-job-btn">Smazat práci</button>
            </div>
        </div>
        <div id="shift-list" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Seznam směn</h3>
                <button type="button" id="back-to-overview-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-left-icon lucide-arrow-left">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                </button>
            </div>
            <div id="shift-list-container"></div>
        </div>
    </dialog>
    <dialog id="shift-modal">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="shift-modal-title">Přidat Směnu</h3>
            <button type="button" id="close-shift-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-x-icon lucide-x">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>
        <hr style="margin-bottom: 15px;">
        <form id="shift-form">
            <div class="form-group">
                <label for="shift-date">Datum</label>
                <input type="text" id="shift-date" required readonly>
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label for="clock-in-input">Začátek</label>
                    <input type="text" id="clock-in-input" placeholder="08:00" inputmode="numeric" maxlength="5" required >
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="clock-out-input">Konec</label>
                    <input type="text" id="clock-out-input" placeholder="16:00" inputmode="numeric" maxlength="5" required >
                </div>
            </div>
            <div class="form-group">
                <label for="shift-note">Poznámka</label>
                <input type="text" id="shift-note" placeholder="(volitelné)">
            </div>
            <button type="submit" class="reg-button">Uložit směnu</button>
        </form>
    </dialog>
    <dialog id="confirm-modal">
        <div style="text-align: center;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">⚠️</div>
            <h3 id="confirm-modal-title" style="margin-bottom: 8px;">Potvrdit akci</h3>
            <p id="confirm-modal-text" style="color: #a1a1aa; font-size: 0.95rem; margin-bottom: 22px;">
                Opravdu si přejete tuto položku smazat? Tato akce je nevratná.
            </p>
            <div style="display: flex; gap: 12px;">
                <button type="button" id="confirm-cancel-btn" class="reg-button" style="flex: 1;">Zrušit</button>
                <button type="button" id="confirm-ok-btn" class="reg-button"
                    style="flex: 1; background-color: #ef4444; border-color: #ef4444; color: white;">Smazat</button>
            </div>
        </div>
    </dialog>
    <dialog id="alert-modal">
        <h3 id="alert-modal-title" style="margin-bottom: 8px;"></h3>
        <p id="alert-modal-text" style="color: #a1a1aa; font-size: 0.95rem; margin-bottom: 22px;"></p>
        <button type="button" id="alert-modal-btn" class="reg-button">Rozumím</button>
        <!--Kdyžtak přidat style="width: 100%"-->
    </dialog>
    <main>
        <div id="dashboard">

        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>

</html>
