<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chytrý Brigádník</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <button id="settings-btn">Nast.</button>
        <h1 class="header-text">Chytrý Brigádník</h1>
        <button id="add-btn">vyt</button>
    </header>
    <dialog id="job-modal">
        <form id="job-form">
            <h3>Nová práce / brigáda</h3>
            <input type="text" id="job-name" placeholder="Název (např. Kavárna)" required>
            <input type="number" id="job-rate" placeholder="Hodinová mzda (Kč)" required>
            <div>
                <label for="tax-payer">Daňový poplatník</label>
                <input type="checkbox" id="tax-payer">
            </div>
            <div>
                <label for="inv-1-2">Invalidita 1. a 2. stupně</label>
                <input type="checkbox" id="inv-1-2">
            </div>
            <div>
                <label for="inv-3">Invalidita 3. stupně</label>
                <input type="checkbox" id="inv-3">
            </div>
            <div>
                <label for="ztp">ZTP/P</label>
                <input type="checkbox" id="ztp">
            </div>
            <input type="number" id="kids-count" placeholder="Počet dětí">
            <hr>
            <button type="submit">Uložit</button>
            <button type="button" id="cancel-btn">Zrušit</button>
        </form>
    </dialog>
    <dialog id="detail-modal">
        <div class="sheet-handle"></div>
        <div id="detail-overview">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="detail-title">Název práce</h2>
                <button type="button" id="close-detail-btn">✕</button>
            </div>
            <hr>
            <div id="detail-content">
                <p id="detail-rate" style="color: #22c55e; font-size: 1.2rem; font-weight: bold;"></p>
            </div>
            <div id="month-selector"
                style="display: flex; justify-content: space-between; align-items:center; margin: 10px 0;">
                <button type="button" id="prev-month-btn">&lt;</button>
                <h3 id="current-month-display">Červenec 2026</h3>
                <button type="button" id="next-month-btn">&gt;</button>
            </div>
            <div id="calendar-grid"></div>

            <button type="button" id="add-shift-btn" style="width: 100%; margin-top: 10px;">+ Přidat
                směnu</button>
            <button type="button" id="show-shift-list" style="width: 100%; margin-top: 10px;">Zobrazit seznam
                směn</button>
            <hr>
            <div id="detail-summary-table">
            </div>
            <hr>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="button" id="delete-job-btn" style="background-color: #ef4444; color: white;">Smazat
                    práci</button>
            </div>
        </div>
        <div id="shift-list" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Seznam směn</h3>
                <button type="button" id="back-to-overview-btn">Zpět</button>
            </div>
            <div id="shift-list-container"></div>
        </div>
    </dialog>
    <dialog id="shift-modal">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Přidat Směnu</h3>
            <button type="button" id="close-shift-btn">✕</button>
        </div>
        <hr style="margin-bottom: 15px;">
        <form id="shift-form">
            <div>
                <label for="shift-date">Datum</label>
                <input type="date" id="shift-date" required>
            </div>
            <div>
                <label for="clock-in-input">Začátek</label>
                <input type="time" name="" id="clock-in-input" required>
            </div>
            <div>
                <label for="clock-out-input">Konec</label>
                <input type="time" name="" id="clock-out-input" required>
            </div>
            <div>
                <label for="shift-note">Poznámka</label>
                <input type="text" id="shift-note" placeholder="(netřeba vyplnit)">
                <button type="submit" style="margin-top: 15px; width: 100%; border-radius: 8px;">Uložit směnu</button>
            </div>
        </form>
    </dialog>
    <main>
        <div id="dashboard">

        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>

</html>
